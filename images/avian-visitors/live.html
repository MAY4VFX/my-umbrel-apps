<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Живой сигнал</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="./favicon.png">
<script>
  // Тема выбирается в основном интерфейсе — следуем ей, чтобы вкладка
  // не выбивалась из остального приложения.
  (function(){
    var pref = null;
    try { pref = localStorage.getItem('bird:theme:v2') || localStorage.getItem('bird:theme'); } catch(e){}
    var dark = pref === 'dark' || (pref !== 'light' &&
      window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root{
    color-scheme:light;
    --paper:#fcfcfb; --paper-2:#f3f2ee; --paper-3:#e8e6df;
    --ink:#1a1612; --ink-2:#4a3f31; --ink-soft:#908576;
    --pill:#fcfcfb; --hairline:rgba(26,22,18,.14);
    --edge-lg:inset 0 0 0 1px rgba(255,255,255,.6),0 0 0 1px rgba(26,22,18,.06),0 8px 28px rgba(26,22,18,.06);
    --recess:inset 0 1px 2px rgba(26,22,18,.06),inset 0 0 0 1px rgba(26,22,18,.04);
    --raised:inset 0 0 0 1px rgba(255,255,255,.8),0 0 0 1px rgba(26,22,18,.05),0 1px 2px rgba(26,22,18,.07);
    --scope:#0e0f12; --mark:#e7ac10;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#17181c; --paper-2:#212329; --paper-3:#2c2f36;
    --ink:#ece8e1; --ink-2:#b7afa2; --ink-soft:#837c70;
    --pill:#2c2f36; --hairline:rgba(236,232,225,.14);
    --edge-lg:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45);
    --recess:inset 0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.04);
    --raised:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.4);
    --scope:#0b0c0e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:400 15px/1.5 ui-sans-serif,-apple-system,system-ui,sans-serif;
    display:flex;flex-direction:column;
    padding:clamp(16px,3vw,34px) clamp(14px,3vw,34px) 96px;
  }
  header{text-align:center;flex:0 0 auto;padding-bottom:clamp(12px,2vw,20px)}
  .pre{
    font:italic 400 clamp(13px,1.4vw,18px)/1.22 ui-serif,"Iowan Old Style",Georgia,serif;
    color:var(--ink-2);letter-spacing:.06em;margin:0 0 4px;
  }
  h1{
    font:400 clamp(26px,4.4vw,44px)/1.04 ui-serif,"Iowan Old Style",Georgia,serif;
    letter-spacing:-.02em;margin:0;
  }
  main{flex:1 1 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 250px;align-items:start;
       max-width:1240px;width:100%;margin:0 auto}
  @media (max-width:880px){main{grid-template-columns:minmax(0,1fr)}}

  .scope{position:relative;border-radius:16px;overflow:hidden;background:var(--scope);box-shadow:var(--edge-lg)}
  canvas{display:block;width:100%;height:min(52vh,440px)}

  /* Плавающая панель поверх полотна — материал, а не полоса, съедающая высоту */
  .chrome{
    position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:10px;
    pointer-events:none;
  }
  .chip{
    pointer-events:auto;display:inline-flex;align-items:center;gap:8px;
    background:rgba(20,21,25,.55);backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    color:#ece8e1;border-radius:999px;padding:8px 14px;
    font:400 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;
    border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
    transition:transform 120ms var(--ease),background 200ms ease;
  }
  button.chip{cursor:pointer}
  button.chip:active{transform:scale(.96)}
  button.chip[aria-pressed="true"]{background:rgba(236,232,225,.9);color:#17181c;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:#7c7468;flex:0 0 auto}
  .chip .dot.on{background:#6fcf72;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}
  .spacer{flex:1 1 auto}

  aside{background:var(--paper-2);border-radius:16px;box-shadow:var(--recess);padding:14px;
        display:flex;flex-direction:column;gap:2px}
  aside h2{font:400 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;
           color:var(--ink-soft);margin:2px 0 10px}
  .card{padding:9px 0;border-top:1px solid var(--hairline);
        animation:rise 420ms var(--ease) both}
  .card:first-of-type{border-top:0}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card .n{font:400 17px/1.15 ui-serif,"Iowan Old Style",Georgia,serif;letter-spacing:-.01em}
  .card .m{font:400 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--ink-soft);margin-top:5px}
  .empty{font:400 10px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--ink-soft)}

  /* Нижний переключатель — тот же, что в основном интерфейсе */
  .slider{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;padding:4px;z-index:30;min-height:40px;
    background:var(--paper-2);border-radius:999px;box-shadow:var(--recess);
  }
  .slider a,.slider button{
    background:transparent;border:0;color:var(--ink-soft);text-decoration:none;
    font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;
    padding:11px 22px;border-radius:999px;cursor:pointer;position:relative;z-index:1;
    transition:color 200ms ease;
  }
  .slider a:hover{color:var(--ink)}
  .slider [aria-current="page"]{color:var(--ink)}
  .seg-pill{position:absolute;top:4px;bottom:4px;left:0;background:var(--pill);border-radius:999px;
            box-shadow:var(--raised);pointer-events:none;z-index:0;
            transition:transform 320ms cubic-bezier(.7,.05,.2,1),width 320ms cubic-bezier(.7,.05,.2,1)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:1ms !important;animation-iteration-count:1 !important;
      transition-duration:120ms !important}
  }
  @media (prefers-reduced-transparency:reduce){
    .chip{background:rgba(20,21,25,.92);backdrop-filter:none;-webkit-backdrop-filter:none}
  }
</style>

<header>
  <p class="pre" id="site">avian visitors</p>
  <h1>Живой сигнал</h1>
</header>

<main>
  <div class="scope">
    <canvas id="c" width="1240" height="440"></canvas>
    <div class="chrome">
      <span class="chip"><span class="dot" id="dot"></span><span id="st">подключаюсь</span></span>
      <span class="spacer"></span>
      <button class="chip" id="snd" type="button" aria-pressed="false">звук</button>
    </div>
  </div>

  <aside>
    <h2>Распознано</h2>
    <div id="feed"><div class="empty">пока тихо</div></div>
  </aside>
</main>

<nav class="slider" aria-label="View">
  <i class="seg-pill" id="pill" aria-hidden="true"></i>
  <a href="./">collage</a>
  <a href="./">stats</a>
  <a href="./">atlas</a>
  <a href="./live.html" aria-current="page" id="tabLive">live</a>
</nav>

<script>
var cv=document.getElementById('c'), g=cv.getContext('2d',{alpha:false});
var st=document.getElementById('st'), dot=document.getElementById('dot'), feed=document.getElementById('feed');
var ctx,analyser,audio,gain,data,running=false;
var MAX_HZ=12000, pxPerSec=0, frames=0, tMark=0, skew=0, seen={}, cards=[];
var dark=document.documentElement.getAttribute('data-theme')==='dark';

// Пилюля садится на активную вкладку — как в основном интерфейсе.
(function(){
  var pill=document.getElementById('pill'), tab=document.getElementById('tabLive');
  function place(){ pill.style.width=tab.offsetWidth+'px';
                    pill.style.transform='translateX('+tab.offsetLeft+'px)'; }
  place(); addEventListener('resize',place);
})();

function stationNow(){ return Date.now()+skew; }

function paint(){
  if(!running) return;
  requestAnimationFrame(paint);
  analyser.getByteFrequencyData(data);
  g.drawImage(cv,-1,0);
  var nyq=ctx.sampleRate/2, bins=Math.min(data.length,Math.round(MAX_HZ/nyq*data.length));
  var x=cv.width-1;
  for(var y=0;y<cv.height;y++){
    var i=Math.round((1-y/cv.height)*(bins-1)), v=data[i]/255;
    // тёплая шкала: тишина уходит в цвет полотна, сигнал — в золото
    g.fillStyle='rgb('+Math.round(238*Math.min(1,v*1.75))+','+
                       Math.round(196*Math.pow(v,1.45))+','+
                       Math.round(84*Math.pow(v,2.6))+')';
    g.fillRect(x,y,1,1);
  }
  frames++;
  var dt=(performance.now()-tMark)/1000;
  if(dt>=2){ pxPerSec=frames/dt; frames=0; tMark=performance.now(); }
}

// Метка нарисована на самом полотне, поэтому уезжает вместе со звуком,
// к которому относится.
function mark(name,conf,ageSec){
  if(!pxPerSec) return;
  var x=Math.round(cv.width-ageSec*pxPerSec);
  if(x<80||x>cv.width) return;
  g.save();
  g.strokeStyle='rgba(231,172,16,.8)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,cv.height); g.stroke();
  g.font='500 14px ui-serif,Georgia,serif'; g.textAlign='right';
  var w=g.measureText(name).width+16;
  g.fillStyle='rgba(11,12,14,.72)';
  g.fillRect(x-w,8,w,38);
  g.fillStyle='#e7ac10'; g.fillText(name,x-8,25);
  g.font='10px ui-monospace,Menlo,monospace'; g.fillStyle='rgba(236,232,225,.65)';
  g.fillText(Math.round(conf*100)+'%',x-8,40);
  g.restore();
}

function render(){
  if(!cards.length){ feed.innerHTML='<div class="empty">пока тихо</div>'; return; }
  feed.innerHTML=cards.slice(0,8).map(function(c){
    var ago=Math.max(0,Math.round((stationNow()-c.at)/1000));
    var when=ago<60?ago+' сек назад':(ago<3600?Math.round(ago/60)+' мин назад':Math.round(ago/3600)+' ч назад');
    return '<div class="card"><div class="n">'+c.name+'</div><div class="m">'+
           Math.round(c.conf*100)+'% · '+when+'</div></div>';
  }).join('');
}

async function poll(){
  try{
    var r=await fetch('./avian/api/birdnet-api.php?action=recent&hours=2',{credentials:'same-origin'});
    var j=await r.json();
    if(j.as_of){ skew=new Date(j.as_of).getTime()-Date.now(); }
    if(j.site_name) document.getElementById('site').textContent=j.site_name.toLowerCase();
    var tz=j.as_of?j.as_of.slice(-6):'';
    (j.species||[]).forEach(function(s){
      var at=new Date(s.last_seen.replace(' ','T')+tz).getTime();
      if(seen[s.sci]===at) return;
      var known=seen[s.sci]!==undefined;
      seen[s.sci]=at;
      cards.unshift({name:s.com,conf:s.best_conf,at:at});
      cards=cards.slice(0,24);
      if(known&&running) mark(s.com,s.best_conf,(stationNow()-at)/1000);
    });
    cards.sort(function(a,b){return b.at-a.at});
    render();
  }catch(e){}
}

function paintIdle(){
  g.fillStyle=dark?'#0b0c0e':'#0e0f12';
  g.fillRect(0,0,cv.width,cv.height);
}

async function start(){
  audio=new Audio('http://'+location.hostname+':8090/stream');
  audio.crossOrigin='anonymous';
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  var src=ctx.createMediaElementSource(audio);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=.55;
  gain=ctx.createGain(); gain.gain.value=0;      // анализ идёт всегда, слышимость — отдельно
  src.connect(analyser); analyser.connect(gain); gain.connect(ctx.destination);
  await audio.play();
  await ctx.resume();
  data=new Uint8Array(analyser.frequencyBinCount);
  running=true; tMark=performance.now(); frames=0;
  dot.classList.add('on'); st.textContent='слушаю';
  paint();
}

// Спектрограмма должна идти сразу. Если браузер требует жеста —
// ловим первый же и стартуем, не заставляя целиться в кнопку.
function boot(){
  paintIdle();
  start().catch(function(){
    st.textContent='коснитесь экрана';
    var go=function(){ start().then(function(){
      removeEventListener('pointerdown',go); removeEventListener('keydown',go);
    }).catch(function(e){ st.textContent='нет потока'; }); };
    addEventListener('pointerdown',go); addEventListener('keydown',go);
  });
}

document.getElementById('snd').addEventListener('click',function(){
  if(!gain) return;
  var on=this.getAttribute('aria-pressed')!=='true';
  this.setAttribute('aria-pressed',on?'true':'false');
  gain.gain.setTargetAtTime(on?1:0,ctx.currentTime,.05);
});

boot(); poll(); setInterval(poll,5000); setInterval(render,15000);
</script>
