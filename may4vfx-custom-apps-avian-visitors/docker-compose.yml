version: "3.7"

services:
  app_proxy:
    # Имена контейнеров заданы явно. umbrelOS ожидает форму <app-id>_<service>_1,
    # оставшуюся от compose v1, но v2 именует контейнеры через дефисы — и прокси
    # переставал находить приложение, отдавая пустую страницу. Полагаться на алиас
    # сервиса (`app`) тоже нельзя: все приложения живут в общей сети
    # umbrel_main_network, где такой алиас есть у каждого второго.
    container_name: may4vfx-custom-apps-avian-visitors_app_proxy_1
    environment:
      APP_HOST: may4vfx-custom-apps-avian-visitors_app_1
      APP_PORT: 80

  app:
    container_name: may4vfx-custom-apps-avian-visitors_app_1
    image: ghcr.io/may4vfx/avian-visitors:latest
    restart: unless-stopped
    # Внутри контейнера работает systemd — отсюда privileged и cgroup: host.
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    devices:
      - /dev/snd:/dev/snd
    volumes:
      # Записи птиц — в именованный том. На этом хосте и /var/lib/docker,
      # и app-data лежат на внешнем SSD, так что на SD-карту непрерывная
      # запись аудио не идёт. Том, в отличие от bind-mount, наследует
      # владельца из образа — иначе каталог создался бы от root и процесс
      # BirdNET не смог бы в него писать.
      - birdsongs:/home/birdnet/BirdSongs
      # Конфиги приходят из папки приложения: umbrelOS кладёт их в app-data
      # с владельцем uid 1000, который внутри контейнера и есть birdnet.
      - ${APP_DATA_DIR}/birdnet.conf:/home/birdnet/BirdNET-Pi/birdnet.conf
      - ${APP_DATA_DIR}/asoundrc:/home/birdnet/.asoundrc:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run
      - /run/lock

volumes:
  birdsongs:
