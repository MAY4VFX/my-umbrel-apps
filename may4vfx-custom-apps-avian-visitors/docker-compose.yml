version: "3.7"

services:
  app_proxy:
    # Имена контейнеров заданы явно. umbrelOS ожидает форму <app-id>_<service>_1,
    # оставшуюся от compose v1, но v2 именует контейнеры через дефисы — и прокси
    # переставал находить приложение, отдавая пустую страницу. Полагаться на алиас
    # сервиса (`app`) тоже нельзя: все приложения живут в общей сети
    # umbrel_main_network, где такой алиас есть у каждого второго.
    container_name: may4vfx-custom-apps-avian-visitors_app_proxy_1
    environment:
      APP_HOST: may4vfx-custom-apps-avian-visitors_app_1
      APP_PORT: 80

  app:
    container_name: may4vfx-custom-apps-avian-visitors_app_1
    image: ghcr.io/may4vfx/avian-visitors:latest
    restart: unless-stopped
    environment:
      # Хост живёт в UTC, а станция стоит в Испании. Локальное время нужно
      # самому BirdNET: по нему считаются рассветы-закаты, суточные графики
      # и недельные отчёты. Хост при этом не трогаем — на нём другие сервисы.
      TZ: Europe/Madrid
    # Внутри контейнера работает systemd — отсюда privileged и cgroup: host.
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    # Живой аудиопоток Icecast — для спектрограммы в реальном времени: браузер
    # берёт звук и рисует её сам, а серверная картинка обновляется лишь раз в
    # 15 секунд. Через app_proxy поток не отдаётся (защита апстрима: микрофон
    # слышит разговоры рядом), поэтому порт пробрасывается в локальную сеть.
    ports:
      - "8091:8000"
    devices:
      - /dev/snd:/dev/snd
    volumes:
      # Записи птиц — в именованный том. На этом хосте и /var/lib/docker,
      # и app-data лежат на внешнем SSD, так что на SD-карту непрерывная
      # запись аудио не идёт. Том, в отличие от bind-mount, наследует
      # владельца из образа — иначе каталог создался бы от root и процесс
      # BirdNET не смог бы в него писать.
      - birdsongs:/home/birdnet/BirdSongs
      # Конфиги приходят из папки приложения: umbrelOS кладёт их в app-data
      # с владельцем uid 1000, который внутри контейнера и есть birdnet.
      - ${APP_DATA_DIR}/birdnet.conf:/home/birdnet/BirdNET-Pi/birdnet.conf
      - ${APP_DATA_DIR}/asoundrc:/home/birdnet/.asoundrc:ro
      # База детекций и состояние админ-авторизации по умолчанию лежат внутри
      # контейнера и обнулялись при каждом его пересоздании — вместе со всеми
      # накопленными наблюдениями и заданным паролем. Путь к базе захардкожен
      # в коде (scripts/birds.db), поэтому монтируем именно файл; состояние
      # авторизации — каталог, и его отдаём тому, чтобы владелец и права
      # унаследовались из образа.
      - ${APP_DATA_DIR}/birds.db:/home/birdnet/BirdNET-Pi/scripts/birds.db
      # Уведомления: адреса Apprise (в них попадает токен бота, поэтому файл
      # заполняется на устройстве) и шаблон сообщения.
      - ${APP_DATA_DIR}/apprise.txt:/home/birdnet/BirdNET-Pi/apprise.txt
      - ${APP_DATA_DIR}/body.txt:/home/birdnet/BirdNET-Pi/body.txt
      - adminstate:/var/lib/avian-visitors
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /usr/share/zoneinfo/Europe/Madrid:/etc/localtime:ro
    tmpfs:
      - /run
      - /run/lock

volumes:
  birdsongs:
  adminstate:
