version: "3.7"

services:
  app_proxy:
    environment:
      # Имя сервиса, а не контейнера: docker compose v2 именует контейнеры
      # через дефисы (may4vfx-custom-apps-avian-visitors-app-1), а принятая
      # в документации Umbrel форма <app-id>_<service>_1 осталась от v1 и
      # здесь не резолвится — прокси отдавал пустую страницу.
      APP_HOST: app
      APP_PORT: 80

  app:
    image: ghcr.io/may4vfx/avian-visitors:latest
    restart: unless-stopped
    # Внутри контейнера работает systemd — отсюда privileged и cgroup: host.
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    devices:
      - /dev/snd:/dev/snd
    volumes:
      # Записи птиц — в именованный том. На этом хосте и /var/lib/docker,
      # и app-data лежат на внешнем SSD, так что на SD-карту непрерывная
      # запись аудио не идёт. Том, в отличие от bind-mount, наследует
      # владельца из образа — иначе каталог создался бы от root и процесс
      # BirdNET не смог бы в него писать.
      - birdsongs:/home/birdnet/BirdSongs
      # Конфиги приходят из папки приложения: umbrelOS кладёт их в app-data
      # с владельцем uid 1000, который внутри контейнера и есть birdnet.
      - ${APP_DATA_DIR}/birdnet.conf:/home/birdnet/BirdNET-Pi/birdnet.conf
      - ${APP_DATA_DIR}/asoundrc:/home/birdnet/.asoundrc:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /run
      - /run/lock

volumes:
  birdsongs:
